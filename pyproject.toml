[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-job-desk"
version = "0.1.0"
description = "Evidence-first campus job verification and application decision desk"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.12,<1",
  "openpyxl>=3.1,<4",
  "rapidfuzz>=3.9,<4",
  "pypdf>=5,<6",
  "publicsuffix2>=2.20191221,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  # SQLAlchemy and Pydantic evaluate annotations at runtime on the project's
  # Python 3.9 baseline, so PEP 604 and de-quoted forward refs are unsafe here.
  "UP037",
  "UP045",
]
